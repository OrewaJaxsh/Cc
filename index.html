  <body>
    <div id="root"></div>

    <!--
      Netlify Forms detection form.
      Netlify's build bot only scans static HTML for forms with
      data-netlify="true" — it cannot see forms rendered by React.
      This hidden form registers "enquiry" with Netlify at build/deploy
      time. Field names here must exactly match the fields submitted
      by the real React form in src/App.jsx.
      This form is never shown to users and never submitted directly.
    -->
    <form
      name="enquiry"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
